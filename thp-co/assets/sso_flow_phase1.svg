<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#173b72"/></marker>
    <style>
      .bg{fill:#f7fbff}.box{fill:#fff;stroke:#c8d6ea;stroke-width:2}.old{fill:#eef5ff;stroke:#4d7fca;stroke-width:2}.new{fill:#ecfff4;stroke:#239b63;stroke-width:2}.warn{fill:#fff7ed;stroke:#d9902f;stroke-width:2}.line{stroke:#173b72;stroke-width:3;fill:none;marker-end:url(#a)}.return{stroke:#d06b00;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#a)}.t1{font:700 30px Segoe UI,Arial;fill:#082d63}.h{font:700 18px Segoe UI,Arial;fill:#082d63}.t{font:500 15px Segoe UI,Arial;fill:#1f2a3a}.m{font:500 13px Consolas,monospace;fill:#10233f}.n{font:800 24px Segoe UI,Arial;fill:#0f4da8}
    </style>
  </defs>
  <rect class="bg" width="1600" height="620" rx="32"/>
  <text x="50" y="58" class="t1">SSO Flow Diagram - transition concept</text>
  <text x="50" y="88" class="t">Phase 1: thailandpost.co.th enters its NAM Appliance, then federates to thailandpost.com IDP during transition.</text>

  <rect x="70" y="160" width="190" height="130" rx="22" class="box"/>
  <text x="92" y="194" class="n">1</text><text x="128" y="194" class="h">User</text>
  <text x="98" y="226" class="t">Open new app</text>
  <text x="98" y="252" class="m">*.thailandpost.co.th</text>
  <line x1="260" y1="225" x2="380" y2="225" class="line"/>

  <rect x="380" y="160" width="250" height="130" rx="22" class="new"/>
  <text x="404" y="194" class="n">2</text><text x="440" y="194" class="h">thailandpost.co.th LB</text>
  <text x="410" y="226" class="m">HTTPS 443</text>
  <text x="410" y="252" class="m">10.239.200.21 / 10.239.200.22</text>
  <text x="410" y="272" class="m">10.239.200.31 / 10.239.200.32</text>
  <line x1="630" y1="225" x2="750" y2="225" class="line"/>

  <rect x="750" y="160" width="260" height="130" rx="22" class="new"/>
  <text x="774" y="194" class="n">3</text><text x="810" y="194" class="h">thailandpost.co.th IDP</text>
  <text x="780" y="226" class="t">Create AuthnRequest</text>
  <text x="780" y="252" class="m">Bridge to thailandpost.com IDP</text>
  <line x1="1010" y1="225" x2="1130" y2="225" class="line"/>

  <rect x="1130" y="160" width="260" height="130" rx="22" class="old"/>
  <text x="1154" y="194" class="n">4</text><text x="1190" y="194" class="h">thailandpost.com IDP</text>
  <text x="1160" y="226" class="m">10.253.105.92 / 10.253.105.93</text>
  <text x="1160" y="252" class="t">Authenticate user</text>

  <rect x="1310" y="370" width="250" height="110" rx="22" class="old"/>
  <text x="1340" y="412" class="h">AA / MFA</text>
  <text x="1340" y="444" class="m">10.253.105.56 / 10.253.105.57</text>
  <line x1="1260" y1="290" x2="1390" y2="370" class="line"/>

  <rect x="470" y="370" width="380" height="108" rx="22" class="warn"/>
  <text x="500" y="408" class="h">5  Assertion returns to thailandpost.co.th</text>
  <text x="500" y="438" class="t">NAM sets session for .thailandpost.co.th</text>
  <text x="500" y="462" class="m">Cookie domain: .thailandpost.co.th</text>
  <path d="M1130 272 C1040 335 925 360 820 370" class="return"/>

  <line x1="850" y1="424" x2="990" y2="424" class="line"/>
  <rect x="990" y="370" width="310" height="108" rx="22" class="new"/>
  <text x="1020" y="408" class="h">6  App is allowed</text>
  <text x="1020" y="438" class="t">AG / Reverse proxy forwards request</text>
  <text x="1020" y="462" class="m">Backend target: THP confirms</text>
</svg>
